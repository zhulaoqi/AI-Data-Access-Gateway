services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
    environment:
      ADG_ENV: production
      ADG_CONTROL_PLANE_DATABASE_URL: sqlite:///./data/adg-control-plane.db
      ADG_BACKEND_PORT: ${ADG_BACKEND_PORT:-8000}
      ADG_BACKEND_HOST_PORT: ${ADG_BACKEND_HOST_PORT:-8000}
      ADG_MCP_QUERY_API_KEY_ENABLED: ${ADG_MCP_QUERY_API_KEY_ENABLED:-false}
      ADG_SECRET_KEY: ${ADG_SECRET_KEY:?Set ADG_SECRET_KEY before starting docker compose}
      ADG_CREDENTIAL_ENCRYPTION_KEY: ${ADG_CREDENTIAL_ENCRYPTION_KEY:?Set ADG_CREDENTIAL_ENCRYPTION_KEY before starting docker compose}
      ADG_MASKING_ENCRYPTION_KEY: ${ADG_MASKING_ENCRYPTION_KEY:?Set ADG_MASKING_ENCRYPTION_KEY before starting docker compose}
      ADG_SECRET_KDF_ITERATIONS: ${ADG_SECRET_KDF_ITERATIONS:-390000}
      ADG_ADMIN_PAGE_DEFAULT_LIMIT: ${ADG_ADMIN_PAGE_DEFAULT_LIMIT:-50}
      ADG_ADMIN_PAGE_MAX_LIMIT: ${ADG_ADMIN_PAGE_MAX_LIMIT:-500}
      ADG_ADMIN_RESOURCE_TREE_MAX_NODES: ${ADG_ADMIN_RESOURCE_TREE_MAX_NODES:-10000}
      ADG_AUTH_RATE_LIMIT_ENABLED: ${ADG_AUTH_RATE_LIMIT_ENABLED:-true}
      ADG_AUTH_RATE_LIMIT_STORAGE: ${ADG_AUTH_RATE_LIMIT_STORAGE:-memory}
      ADG_AUTH_RATE_LIMIT_REDIS_URL: ${ADG_AUTH_RATE_LIMIT_REDIS_URL:-}
      ADG_AUTH_RATE_LIMIT_WINDOW_SECONDS: ${ADG_AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      ADG_AUTH_RATE_LIMIT_MAX_FAILURES: ${ADG_AUTH_RATE_LIMIT_MAX_FAILURES:-10}
      ADG_AUTH_RATE_LIMIT_BLOCK_SECONDS: ${ADG_AUTH_RATE_LIMIT_BLOCK_SECONDS:-300}
      ADG_AUTH_RATE_LIMIT_MEMORY_MAX_BUCKETS: ${ADG_AUTH_RATE_LIMIT_MEMORY_MAX_BUCKETS:-10000}
      ADG_SQL_EXECUTION_MODE: ${ADG_SQL_EXECUTION_MODE:-read_only}
      ADG_SQL_STRICT_VALIDATION: ${ADG_SQL_STRICT_VALIDATION:-true}
      ADG_SQL_REJECT_WILDCARD: ${ADG_SQL_REJECT_WILDCARD:-false}
      ADG_RUNTIME_DATASOURCE_POOL_CACHE_SIZE: ${ADG_RUNTIME_DATASOURCE_POOL_CACHE_SIZE:-32}
      ADG_RUNTIME_DATASOURCE_POOL_IDLE_TTL_SECONDS: ${ADG_RUNTIME_DATASOURCE_POOL_IDLE_TTL_SECONDS:-300}
      ADG_RUNTIME_DATASOURCE_POOL_SIZE: ${ADG_RUNTIME_DATASOURCE_POOL_SIZE:-5}
      ADG_RUNTIME_DATASOURCE_POOL_MAX_OVERFLOW: ${ADG_RUNTIME_DATASOURCE_POOL_MAX_OVERFLOW:-0}
      ADG_RUNTIME_DATASOURCE_CONNECT_TIMEOUT_SECONDS: ${ADG_RUNTIME_DATASOURCE_CONNECT_TIMEOUT_SECONDS:-10}
      ADG_RUNTIME_DATASOURCE_READ_TIMEOUT_SECONDS: ${ADG_RUNTIME_DATASOURCE_READ_TIMEOUT_SECONDS:-120}
      ADG_RUNTIME_DATASOURCE_WRITE_TIMEOUT_SECONDS: ${ADG_RUNTIME_DATASOURCE_WRITE_TIMEOUT_SECONDS:-120}
      ADG_RUNTIME_QUERY_MAX_LIMIT: ${ADG_RUNTIME_QUERY_MAX_LIMIT:-1000}
      ADG_RUNTIME_DECRYPT_MAX_VALUES: ${ADG_RUNTIME_DECRYPT_MAX_VALUES:-100}
      ADG_METADATA_SCAN_MAX_DATABASES: ${ADG_METADATA_SCAN_MAX_DATABASES:-25}
      ADG_DATASOURCE_NETWORK_ALLOWLIST: ${ADG_DATASOURCE_NETWORK_ALLOWLIST:-}
      PYTHONUNBUFFERED: "1"
    command: >
      sh -c "alembic upgrade head &&
      uvicorn adg.app.main:create_app --factory --host 0.0.0.0 --port ${ADG_BACKEND_PORT:-8000}"
    expose:
      - "${ADG_BACKEND_PORT:-8000}"
    ports:
      - "${ADG_BACKEND_HOST_PORT:-8000}:${ADG_BACKEND_PORT:-8000}"
    volumes:
      - adg-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from os import environ; from urllib.request import urlopen; urlopen(f\"http://127.0.0.1:{environ.get('ADG_BACKEND_PORT', '8000')}/health\")",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NPM_REGISTRY_URL: ${NPM_REGISTRY_URL:-https://registry.npmjs.org/}
    environment:
      ADG_BACKEND_PORT: ${ADG_BACKEND_PORT:-8000}
    ports:
      - "${ADG_WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  adg-data:
